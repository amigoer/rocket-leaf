# Build asset configuration.
#
# After changing `info`, run `wails3 task common:update:build-assets` to
# regenerate the platform manifests. That overwrites manual edits to the
# generated files, so keep customisations here.
#
# `version` is mirrored from package.json; `npm run check:version` enforces it.
version: '3'

info:
  companyName: "amigoer"
  productName: "MQ Studio"
  productIdentifier: "com.mqstudio.app"
  description: "Local-first desktop client for message queues"
  copyright: "(c) 2026, amigoer"
  comments: "Local-first desktop client for message queues"
  version: "0.1.0"

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary

fileAssociations:

other:
