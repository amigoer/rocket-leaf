name: "\U0001F41E Bug 反馈"
description: 应用的行为和预期不一致
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        English speakers please use the **Bug report** template instead.

  - type: checkboxes
    id: checks
    attributes:
      label: 提交之前
      options:
        - label: 我搜索过[已有的 issue](https://github.com/amigoer/mq-studio/issues?q=is%3Aissue)（含已关闭的），没有找到相同的问题
          required: true
        - label: 在[最新版本](https://github.com/amigoer/mq-studio/releases/latest)上问题依然存在
          required: true

  - type: input
    id: version
    attributes:
      label: MQ Studio 版本
      description: 在「设置 → 关于」里可以看到。
      placeholder: 0.0.6
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - macOS（Apple 芯片）
        - macOS（Intel）
        - Windows
        - Linux
    validations:
      required: true

  - type: dropdown
    id: driver
    attributes:
      label: 涉及哪个消息队列
      description: >
        问题出现在哪个驱动下。窗口、设置、连接列表、软件更新这类问题请选「与具体消息队列无关」。
      options:
        - 与具体消息队列无关
        - RocketMQ
        - Kafka
        - RabbitMQ
        - Pulsar
        - Redis Stream
        - NATS
        - MQTT
        - ActiveMQ
        - NSQ
    validations:
      required: true

  - type: input
    id: broker-version
    attributes:
      label: 服务端版本与部署方式
      description: 与具体消息队列无关的问题可以留空。
      placeholder: RocketMQ 5.3.1，Docker 单节点

  - type: textarea
    id: what
    attributes:
      label: 实际发生了什么
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 你期望的结果是什么
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开应用写到出问题的那一步。
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 截图，以及应用给出的报错
      description: >
        报错尽量以文字粘贴，不要只截图。issue 是公开的，地址、密钥等不便公开的信息请先打码。

  - type: textarea
    id: context
    attributes:
      label: 其他补充
      description: >
        比如是不是升级之后才出现的、换一个连接是否正常、是否偶发。
