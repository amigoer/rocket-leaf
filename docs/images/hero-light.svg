<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">MQ Studio</title>
  <desc id="d">MQ Studio — see inside your message queues. One local-first desktop app for RocketMQ, RabbitMQ, Kafka, Pulsar, Redis Stream, MQTT, NATS, ActiveMQ, NSQ, Amazon SQS, Google Pub/Sub, Azure Service Bus, and Amazon Kinesis, with more drivers landing and no web console to deploy.</desc>

  <!-- eyebrow -->
  <text x="10" y="50" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="16.5" letter-spacing="3" fill="#71717A">LOCAL-FIRST · NOTHING TO DEPLOY · OPEN SOURCE</text>

  <!-- logo tile + wordmark -->
  <g id="lockup">
    <rect x="10" y="76" width="88" height="88" rx="19.8" fill="#EC3013"/>
    <g transform="translate(22.86 96.761) scale(0.46478)" fill="none" stroke-width="10">
      <path d="M12 74 L12 26 L34 55 L56 26 L56 74" stroke="#F3F2F2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="98" cy="50" r="24" stroke="#F3F2F2"/>
      <line x1="109" y1="63" x2="120" y2="74" stroke="#201E1D" stroke-linecap="round"/>
    </g>
    <text x="126" y="142" font-family="-apple-system,'PingFang SC','Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="60" font-weight="800" letter-spacing="-1" fill="#18181B">MQ Studio</text>
  </g>

  <!-- value -->
  <text x="10" y="219" font-family="-apple-system,'PingFang SC','Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="28" font-weight="600" fill="#3F3F46">See inside your message queues.</text>
  <text x="10" y="255" font-family="-apple-system,'PingFang SC','Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="20.5" fill="#71717A">One desktop app for clusters, topics, consumers, and messages.</text>

