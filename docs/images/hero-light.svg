    <circle cx="32" cy="304" r="4.5" fill="#29915D"/>
    <text x="46" y="310" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="16.5" fill="#52525B">10 drivers available</text>
    <text x="282" y="310" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="16.5" fill="#71717A">macOS · Windows · Linux&#160;&#160;·&#160;&#160;Apache-2.0</text>
  </g>

