<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">MQ Studio</title>
  <desc id="d">MQ Studio：本地优先的消息队列桌面客户端。一套界面连接 RocketMQ、RabbitMQ、Kafka、Pulsar、Redis Stream、MQTT、NATS、ActiveMQ、NSQ、Amazon SQS、Google Pub/Sub、Azure Service Bus、Amazon Kinesis、IBM MQ 与 Solace PubSub+，更多驱动陆续接入，无需部署 Web 控制台。</desc>

  <!-- eyebrow -->
  <text x="10" y="50" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="16.5" letter-spacing="3" fill="#71717A">LOCAL-FIRST · NOTHING TO DEPLOY · OPEN SOURCE</text>

  <!-- logo tile + wordmark -->
  <g id="lockup">
    <rect x="10" y="76" width="88" height="88" rx="19.8" fill="#EC3013"/>
    <g transform="translate(22.86 96.761) scale(0.46478)" fill="none" stroke-width="10">
      <path d="M12 74 L12 26 L34 55 L56 26 L56 74" stroke="#F3F2F2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="98" cy="50" r="24" stroke="#F3F2F2"/>
      <line x1="109" y1="63" x2="120" y2="74" stroke="#201E1D" stroke-linecap="round"/>
    </g>
    <text x="126" y="142" font-family="-apple-system,'PingFang SC','Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="60" font-weight="800" letter-spacing="-1" fill="#18181B">MQ Studio</text>
  </g>

  <!-- value -->
  <text x="10" y="219" font-family="-apple-system,'PingFang SC','Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="30" font-weight="600" letter-spacing="1" fill="#3F3F46">消息队列桌面客户端</text>
  <text x="10" y="255" font-family="-apple-system,'PingFang SC','Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="20.5" fill="#71717A">管理集群、Topic、消费者与消息 — 无需部署 Web 控制台。</text>

  <!-- metadata -->
  <g id="meta">
    <rect x="10" y="286" width="202" height="36" rx="18" fill="none" stroke="#E0E0E3" stroke-width="1.5"/>
    <circle cx="32" cy="304" r="4.5" fill="#29915D"/>
    <text x="46" y="310" font-family="-apple-system,'PingFang SC','Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="16.5" fill="#52525B">已支持 15 个驱动</text>
    <text x="240" y="310" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="16.5" fill="#71717A">macOS · Windows · Linux&#160;&#160;·&#160;&#160;Apache-2.0</text>
  </g>

